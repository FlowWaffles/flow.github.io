name: Update commander data

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-commander-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh commander dataset
        run: npm run update:commanders

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/pages/mtg/commanders-data.ts; then
            echo "Commander data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/mtg/commanders-data.ts
          git commit -m "chore(mtg): refresh commander data"
          git push
